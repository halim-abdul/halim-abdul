<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="660"
  viewBox="0 0 1100 660"
  role="img"
  aria-label="Abdul Halim Research Network — Mathematics, Artificial Intelligence, Scientific Computing and Actuarial Science"
>

  <title>Abdul Halim — Research and Technical Network</title>

  <desc>
    Animated research network connecting Mathematics,
    Machine Learning, Computer Vision, Natural Language Processing,
    Topological Data Analysis, Artificial Intelligence, MLOps,
    AI Engineer, Geometric Deep Learning, Scientific Computing,
    and Actuarial Science.
  </desc>

  <!-- ======================================================= -->
  <!-- DEFINITIONS -->
  <!-- ======================================================= -->

  <defs>

    <!-- Animated connection gradient -->

    <linearGradient
      id="lineGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >

      <stop offset="0%" stop-color="#00D9FF">
        <animate
          attributeName="stop-color"
          values="#00D9FF;#58A6FF;#8A2BE2;#FF1493;#00D9FF"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="50%" stop-color="#8A2BE2">
        <animate
          attributeName="stop-color"
          values="#8A2BE2;#FF1493;#00D9FF;#58A6FF;#8A2BE2"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#FF1493">
        <animate
          attributeName="stop-color"
          values="#FF1493;#00D9FF;#8A2BE2;#58A6FF;#FF1493"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

    </linearGradient>


    <!-- Animated central gradient -->

    <radialGradient id="centerGradient">

      <stop offset="0%" stop-color="#203A43">
        <animate
          attributeName="stop-color"
          values="#203A43;#243B55;#392B58;#203A43"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="60%" stop-color="#6C3FD1">
        <animate
          attributeName="stop-color"
          values="#6C3FD1;#007ACC;#8A2BE2;#6C3FD1"
          dur="8s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#00C9FF"/>

    </radialGradient>


    <!-- Strong glowing effect -->

    <filter
      id="strongGlow"
      x="-60%"
      y="-60%"
      width="220%"
      height="220%"
    >

      <feGaussianBlur
        stdDeviation="6"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>


    <!-- Soft glowing effect -->

    <filter
      id="softGlow"
      x="-40%"
      y="-40%"
      width="180%"
      height="180%"
    >

      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ======================================================= -->
  <!-- ROTATING BACKGROUND RINGS -->
  <!-- ======================================================= -->

  <circle
    cx="550"
    cy="310"
    r="190"
    fill="none"
    stroke="#58A6FF"
    stroke-width="1"
    stroke-dasharray="3 12"
    opacity="0.18"
  >

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 550 310"
      to="360 550 310"
      dur="35s"
      repeatCount="indefinite"
    />

  </circle>


  <circle
    cx="550"
    cy="310"
    r="230"
    fill="none"
    stroke="#8A2BE2"
    stroke-width="1"
    stroke-dasharray="5 16"
    opacity="0.12"
  >

