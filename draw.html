<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Mathematical Drawing | Abdul Halim</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  background:
    radial-gradient(
      circle at 10% 5%,
      #27305c,
      #0c1020 58%
    );

  color: #eef2ff;

  font-family:
    'Segoe UI',
    Arial,
    sans-serif;

  min-height: 100vh;

  display: grid;
  place-items: center;

  padding: 22px;
}

main {
  width: min(100%, 1030px);
}

h1 {
  font-size: clamp(1.7rem, 4vw, 2.7rem);
  margin-bottom: 5px;
}

p {
  color: #b9c2db;
  margin-bottom: 20px;
}

.card {
  background: #151b30;

  border: 1px solid #313b57;

  padding: 18px;

  border-radius: 22px;

  box-shadow:
    0 18px 64px #0007;
}

.controls {
  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap: 12px;

  margin-bottom: 14px;
}

button {
  background: #815af8;

  border: none;

  color: white;

  padding: 10px 16px;

  font-weight: 700;

  border-radius: 9px;

  cursor: pointer;

  transition:
    transform 0.2s ease,
    background 0.2s ease;
}

button:hover {
  background: #6845d8;
  transform: translateY(-2px);
}

button.secondary {
  background: #313b57;
}

label {
  display: flex;

  gap: 7px;

  align-items: center;
}

input[type="color"] {
  width: 42px;
  height: 38px;

  background: none;

  border: none;
}

canvas {
  display: block;

  width: 100%;
  height: auto;

  aspect-ratio: 16 / 9;

  background: white;

  border-radius: 12px;

  touch-action: none;

  cursor: crosshair;
}

small {
  display: block;

  color: #b9c2db;

  margin-top: 12px;
}

</style>

</head>

<body>

<main>

<h1>✍️ Mathematical Drawing Studio</h1>

<p>
  Draw mathematical diagrams, geometric shapes,
  formulas, illustrations, or your own signature.
</p>

<div class="card">

<div class="controls">

<label>
  Ink

  <input
    id="color"
    type="color"
    value="#5533cc"
  >
</label>

<label>
  Brush

  <input
    id="size"
    type="range"
    min="1"
    max="32"
    value="4"
  >
</label>

<button id="eraser" class="secondary">
  Eraser: off
</button>

<button id="undo" class="secondary">
  Undo
</button>

<button id="clear" class="secondary">
  Clear
</button>

<button id="save">
  Download PNG ↓
</button>

</div>

<canvas
  id="canvas"
  width="1600"
  height="900"
  aria-label="Interactive drawing area"
></canvas>

<small>
  Draw with a mouse, finger, or digital pen.
  Download your drawing and add it to your GitHub profile.
</small>

</div>

</main>

<script>

// Canvas initialization

const canvas = document.querySelector("#canvas");

const ctx = canvas.getContext("2d");

const color = document.querySelector("#color");

const size = document.querySelector("#size");

const history = [];

let painting = false;

let eraser = false;


// White background

function white() {

  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

}

white();


// Store previous canvas states

function snapshot() {

  history.push(
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    )
  );

  if (history.length > 25) {
    history.shift();
  }

}


// Mouse / touch coordinates

function pos(event) {

  const rect = canvas.getBoundingClientRect();

  const x =
    (event.clientX - rect.left) *
    canvas.width / rect.width;

  const y =
    (event.clientY - rect.top) *
    canvas.height / rect.height;

  return [x, y];

}


// Start drawing

canvas.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    snapshot();

    painting = true;

    canvas.setPointerCapture(event.pointerId);

    const [x, y] = pos(event);

    ctx.beginPath();

    ctx.moveTo(x, y);

    ctx.lineTo(x + 0.01, y + 0.01);

    ctx.strokeStyle =
      eraser ? "#ffffff" : color.value;

    ctx.lineWidth =
      Number(size.value) *
      (canvas.width / 800);

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.stroke();

  }
);


// Draw continuously

canvas.addEventListener(
  "pointermove",
  event => {

    if (!painting) return;

    event.preventDefault();

    const [x, y] = pos(event);

    ctx.lineTo(x, y);

    ctx.stroke();

  }
);


// Stop drawing

for (const type of [
  "pointerup",
  "pointercancel",
  "lostpointercapture"
]) {

  canvas.addEventListener(
    type,
    () => painting = false
  );

}


// Eraser

document.querySelector("#eraser").onclick =
  event => {

    eraser = !eraser;

    event.currentTarget.textContent =
      "Eraser: " +
      (eraser ? "on" : "off");

  };


// Undo last action

document.querySelector("#undo").onclick =
  () => {

    if (history.length) {

      ctx.putImageData(
        history.pop(),
        0,
        0
      );

    }

  };


// Clear canvas

document.querySelector("#clear").onclick =
  () => {

    snapshot();

    white();

  };


// Download drawing

document.querySelector("#save").onclick =
  () => {

    const link = document.createElement("a");

    link.download =
      "abdul-halim-mathematical-drawing.png";

    link.href =
      canvas.toDataURL("image/png");

    link.click();

  };

</script>

</body>

</html>
