<svg width="750" height="80" viewBox="0 0 750 80"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Animated gradient -->
    <linearGradient id="animatedGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">

      <stop offset="0%" stop-color="#58A6FF">
        <animate
          attributeName="stop-color"
          values="#58A6FF;#00FFFF;#A855F7;#FF4ECD;#58A6FF"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#A855F7">
        <animate
          attributeName="stop-color"
          values="#A855F7;#FF4ECD;#58A6FF;#00FFFF;#A855F7"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#FF4ECD">
        <animate
          attributeName="stop-color"
          values="#FF4ECD;#58A6FF;#00FFFF;#A855F7;#FF4ECD"
          dur="4s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>


    <!-- Typing reveal -->
    <clipPath id="typingClip">

      <rect
        x="120"
        y="0"
        width="0"
        height="80">

        <animate
          attributeName="width"
          values="
          0;
          30;
          60;
          90;
          120;
          150;
          180;
          210;
          240;
          270;
          300;
          330;
          360;
          390;
          420;
          450;
          480;
          510;
          540;
          570;
          600"
          keyTimes="
          0;
          0.05;
          0.10;
          0.15;
          0.20;
          0.25;
          0.30;
          0.35;
          0.40;
          0.45;
          0.50;
          0.55;
          0.60;
          0.65;
          0.70;
          0.75;
          0.80;
          0.85;
          0.90;
          0.95;
          1"
          dur="4s"
          fill="freeze"/>

      </rect>

    </clipPath>

  </defs>


  <!-- Text -->
  <g clip-path="url(#typingClip)">

    <text
      x="120"
      y="52"
      font-family="'Fira Code', monospace"
      font-size="35"
      font-weight="700"
      fill="url(#animatedGradient)">

      Hi, I'm Halim Abdul 👋

    </text>

  </g>


  <!-- Cursor -->

  <rect
    x="120"
    y="18"
    width="3"
    height="42"
    fill="#58A6FF">

    <!-- cursor moves while typing -->

    <animate
      attributeName="x"
      from="120"
      to="720"
      dur="4s"
      fill="freeze"/>

    <!-- cursor blinking -->

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.7s"
      repeatCount="indefinite"/>

  </rect>

</svg>
